<div class="reset-page">
  <div class="container">
    <div class="reset-card animated fadeInDown">
      <div class="card-header">
        <div class="logo">
          <img src="/images/logo/logo1.jpeg" alt="Logo">
        </div>
        <h1>{{ 'ln.ResetPassword' | translate }}</h1>
        <p>{{ 'ln.ResetPasswordSubtitle' | translate }}</p>
      </div>

      <form [formGroup]="resetForm" (ngSubmit)="onSubmit()" class="reset-form">
        <mat-form-field appearance="outline">
          <mat-label>{{ 'ln.UsernameOrPhoneOrEmail' | translate }}</mat-label>
          <input matInput formControlName="username" [placeholder]="'ln.EnterInfoPlaceholder' | translate" [readonly]="isOtpSent()">
          <mat-icon matSuffix>person</mat-icon>
        </mat-form-field>

        @if (isOtpSent()) {
          <div class="otp-section animated fadeIn">
            <mat-form-field appearance="outline">
              <mat-label>OTP</mat-label>
              <input matInput formControlName="otp" [placeholder]="'ln.SixDigitCode' | translate">
              <span matSuffix class="otp-timer" *ngIf="countdown() > 0">{{ countdown() }}s</span>
            </mat-form-field>
            
            <mat-form-field appearance="outline">
              <mat-label>{{ 'ln.NewPassword' | translate }}</mat-label>
              <input matInput [type]="isPasswordVisible() ? 'text' : 'password'" formControlName="password" placeholder="******">
              <button mat-icon-button matSuffix (click)="togglePasswordVisibility()" type="button">
                <mat-icon>{{ isPasswordVisible() ? 'visibility' : 'visibility_off' }}</mat-icon>
              </button>
            </mat-form-field>

            @if (countdown() === 0) {
              <button type="button" class="resend-btn" (click)="onSendOtp()">{{ 'ln.ResendOtp' | translate }}</button>
            }
          </div>
        }

        <button mat-raised-button color="primary" type="submit" [disabled]="isLoading()" class="btn-submit">
          @if (isLoading()) {
            {{ 'ln.Processing' | translate }}
          } @else {
            {{ isOtpSent() ? ('ln.ChangePassword' | translate) : ('ln.SendOtp' | translate) }}
          }
        </button>
      </form>

      <div class="card-footer">
        <p><a routerLink="/login">{{ 'ln.BackToLogin' | translate }}</a></p>
      </div>
    </div>
  </div>
</div>
