<section class="shop-category">
  <div class="container">
    <div class="shop-category-main">
      @if (isLoadingCategoryMenu()) {
        <div class="category-track">
          @for (data of [1, 2, 3, 4, 5, 6, 7, 8]; track data) {
            <app-category-loader-card></app-category-loader-card>
          }
        </div>
      } @else {
        <div style="display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center;">
          <div style="overflow: hidden;">
            <swiper-container [slidesPerView]="'auto'" [spaceBetween]="10" [freeMode]="true" rewind="true" autoplay="true" autoplay-delay="3000" class="mySwiper" style="padding-bottom: 4px;">
              @for (data of categories(); track data._id || $index) {
                <swiper-slide style="width: auto;">
                  <app-category-card-one [data]="data"></app-category-card-one>
                </swiper-slide>
              }
            </swiper-container>
          </div>

          <div style="padding-bottom: 4px; padding-right: 5px;">
            <div class="shop-category-card">
              <a routerLink="/category-list" class="shop-card-title">
                <i class="fa-sharp fa-solid fa-bars"></i>
                <span>{{ "ln.SeeMore" | translate }}</span>
              </a>
            </div>
          </div>
        </div>
      }
    </div>
  </div>
</section>
